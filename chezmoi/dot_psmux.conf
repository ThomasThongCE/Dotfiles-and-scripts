# ~/.psmux.conf  — psmux (tmux-compatible syntax)

# ── Prefix -> C-a ────────────────────────────────────────
set -g prefix C-a
unbind C-b
# double-tap sends literal C-a to app
bind C-a send-keys C-a

# ── Defaults (all documented psmux options) ──────────────
# mouse off: psmux forwards mouse-motion reports into panes; yazi/TUI on ConPTY
# can't consume them -> escape-code flood. No option throttles motion, so mouse off.
set -g mouse off
# (kept for if mouse re-enabled: don't hijack scroll into copy-mode over TUI apps)
set -g scroll-enter-copy-mode off
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
# low for snappy <Esc> in nvim, but not so low that CSI-u/modifyOtherKeys
# terminals (Windows Terminal) mis-read Ctrl-key escape sequences -> broke C-a prefix at 10
set -g escape-time 50
# nvim autoread / cursor-shape
set -g focus-events on
set -g display-time 2000
set -g aggressive-resize on
# vi copy-mode
set -g mode-keys vi
# Windows psmux implements automatic-rename by snapshotting the whole OS
# process table (~500+ procs) every ~1s per pane -> input lag while typing.
# Disable it; name windows manually with `prefix ,`.
set -g automatic-rename off
set -g allow-rename off

# ── Pane borders ─────────────────────────────────────────
# Contrast comes from the pair: inactive borders are pushed near-background so
# the active one is the only bright line on screen. Changing colour238 up
# undoes the effect even if the active colour stays.
set -g pane-active-border-style "fg=colour45,bold"
set -g pane-border-style "fg=colour238"
set -g pane-border-lines heavy
# pane-border-status top is settable but its extra row is not subtracted from
# the pane's usable height -> cursor lands one line off. Leave it unset.

# ── Reload ───────────────────────────────────────────────
bind r source-file ~/.psmux.conf

# ── Splits open in current pane's dir ────────────────────
# pane_current_path is supported (help shows #{b:} / #{d:} on it)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# ── nvim-aware Ctrl-h/j/k/l  (VERIFY — see notes) ────────
# If focused pane runs nvim, pass the key through; else move pane.
# Pure-format test: no ps/grep, Windows-safe IF psmux supports
# `bind -n`, `if-shell -F`, and #{pane_current_command}.
bind -n C-h if-shell -F "#{==:#{pane_current_command},nvim}" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell -F "#{==:#{pane_current_command},nvim}" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell -F "#{==:#{pane_current_command},nvim}" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell -F "#{==:#{pane_current_command},nvim}" "send-keys C-l" "select-pane -R"
# reclaim clear-screen under prefix
bind C-l send-keys C-l

# ── Merge a window into this one as a pane ───────────────
bind g command-prompt -p "join from window:" "join-pane -h -s '%%'"

# ── Pane resize (prefix + H/J/K/L, repeatable) ───────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Pane focus (prefix + h/j/k/l) ────────────────────────
# Matches herdr focus_pane_*. Takes prefix+l from last-window.
# prefix+; stays last-pane: psmux 3.3.7 hardwires it, bind-key ";" exits 0
# and changes nothing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Splits: v side by side, s stacked (nvim ctrl+w v / ctrl+w s) ──
# | and - above still work. v was rectangle-toggle, s was choose-session.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S choose-session

# ── Last window ──────────────────────────────────────────
# Not ; — psmux 3.3.7 hardwires that to last-pane.
bind Tab last-window
